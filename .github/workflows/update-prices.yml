name: Update cardamom prices
on:
  schedule:
    - cron: '20 */3 * * *'  # every 3 hours; GitHub often delays scheduled runs, so several tries a day keep the price date fresh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/update-prices.mjs
      - run: npm run build
      - run: npm run check
      - name: Commit
        run: |
          git config user.name "senvora-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Daily price update" && git push)
